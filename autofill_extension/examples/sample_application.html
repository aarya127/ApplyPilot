<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Job Application</title>
    <style>
      body {
        margin: 0;
        background: #f6f7f9;
        color: #162033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(840px, calc(100vw - 32px));
        margin: 32px auto 56px;
      }

      form {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }

      section {
        background: #ffffff;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        padding: 18px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      label,
      fieldset {
        display: grid;
        gap: 6px;
        color: #5f6b7a;
        font-size: 13px;
        font-weight: 700;
      }

      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #d8dee8;
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }

      textarea {
        min-height: 110px;
      }

      .radio-row {
        display: flex;
        gap: 16px;
        color: #162033;
      }

      .radio-row label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #162033;
      }

      button {
        width: max-content;
        border: 0;
        border-radius: 6px;
        background: #125c8a;
        color: #ffffff;
        padding: 11px 16px;
        font-weight: 700;
      }

      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sample Software Engineer Application</h1>

      <form>
        <section>
          <h2>Personal Information</h2>
          <div class="grid">
            <label for="candidate-first-name">Legal first name<input id="candidate-first-name" name="firstName"></label>
            <label for="candidate-last-name">Legal last name<input id="candidate-last-name" name="lastName"></label>
            <label>Email Address<input name="email_address" type="email"></label>
            <label>Mobile phone<input name="phone" type="tel"></label>
            <label>LinkedIn URL<input name="linkedin"></label>
            <label>Personal website<input name="website"></label>
          </div>
        </section>

        <section>
          <h2>Address</h2>
          <div class="grid">
            <label>Street address<input name="address_line_1"></label>
            <label>City<input name="city"></label>
            <label>Province / State<input name="region"></label>
            <label>Postal code / ZIP<input name="postal_code"></label>
            <label>Country<input name="country"></label>
          </div>
        </section>

        <section>
          <h2>Education</h2>
          <div class="grid">
            <label>University / College<input name="school"></label>
            <label>Degree or program<input name="degree"></label>
            <label>Expected graduation date<input name="graduation"></label>
            <label>Current location<input name="currentLocation"></label>
          </div>
        </section>

        <section>
          <h2>Application Questions</h2>
          <div class="grid">
            <label>
              Are you legally authorized to work in Canada?
              <select name="work_authorization">
                <option value="">Select one</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </label>

            <label>
              Are you a Canadian citizen?
              <select name="canadian_citizen">
                <option value="">Select one</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </label>

            <label>
              Are you a United States lawful permanent resident?
              <select name="us_permanent_resident">
                <option value="">Select one</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </label>

            <fieldset>
              <legend>Will you now or in the future require visa sponsorship?</legend>
              <div class="radio-row">
                <label><input type="radio" name="sponsorship" value="Yes">Yes</label>
                <label><input type="radio" name="sponsorship" value="No">No</label>
              </div>
            </fieldset>

            <label>Salary expectation<input name="salaryExpectation"></label>
            <label>Relocation preference<input name="relocation"></label>
            <label>Are you subject to a non-compete or similar agreement?<input name="subject_to_agreement"></label>
          </div>
        </section>

        <section>
          <h2>Voluntary Self Identification</h2>
          <div class="grid">
            <label>Race<input name="race"></label>
            <label>Ethnicity<input name="ethnicity"></label>
            <label>Gender<input name="gender"></label>
            <label>Gender identity<input name="gender_identity"></label>
          </div>
        </section>

        <section>
          <h2>Long Answer</h2>
          <label>
            Tell us why you are interested in this role.
            <textarea name="interest"></textarea>
          </label>
        </section>

        <button type="button">Submit manually</button>
      </form>
    </main>
  </body>
</html>
